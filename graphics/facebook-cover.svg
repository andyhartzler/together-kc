<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="312" viewBox="0 0 820 312" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Navy gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002855"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>

    <!-- Subtle blue glow -->
    <radialGradient id="blueGlow" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0077C8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0077C8" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#0077C8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="url(#bgGradient)"/>
  <rect width="820" height="312" fill="url(#blueGlow)"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="307" width="820" height="5" fill="url(#accentGradient)"/>

  <!-- Logo image - positioned left-center with room for profile pic -->
  <image
    xlink:href="/Users/andrew/Desktop/e-tax renewal_print.jpg"
    x="200"
    y="90"
    width="340"
    height="132"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- Right side: Vote Yes box -->
  <rect x="600" y="100" width="160" height="85" fill="#C8102E"/>
  <text x="680" y="145"
    font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
    font-size="36"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="3">VOTE YES</text>
  <text x="680" y="172"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="12"
    font-weight="600"
    fill="#FFFFFF"
    fill-opacity="0.8"
    text-anchor="middle"
    letter-spacing="2">APRIL 7, 2026</text>

  <!-- Website -->
  <text x="680" y="215"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="600"
    fill="#FFFFFF"
    fill-opacity="0.5"
    text-anchor="middle"
    letter-spacing="1">together-kc.com</text>
</svg>
