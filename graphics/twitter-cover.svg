<?xml version="1.0" encoding="UTF-8"?>
<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Navy gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a3a"/>
      <stop offset="50%" stop-color="#002855"/>
      <stop offset="100%" stop-color="#001a3a"/>
    </linearGradient>

    <!-- Blue glow top right -->
    <radialGradient id="blueGlow" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#0077C8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0077C8" stop-opacity="0"/>
    </radialGradient>

    <!-- Red glow bottom left -->
    <radialGradient id="redGlow" cx="20%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#0077C8"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1500" height="500" fill="url(#bgGradient)"/>
  <rect width="1500" height="500" fill="url(#blueGlow)"/>
  <rect width="1500" height="500" fill="url(#redGlow)"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="494" width="1500" height="6" fill="url(#accentGradient)"/>

  <!-- Logo image - centered -->
  <image
    xlink:href="/Users/andrew/Desktop/e-tax renewal_print.jpg"
    x="350"
    y="140"
    width="480"
    height="186"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- Right side: Vote Yes box -->
  <rect x="920" y="165" width="220" height="120" fill="#C8102E"/>
  <text x="1030" y="225"
    font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
    font-size="52"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="4">VOTE YES</text>
  <text x="1030" y="265"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="14"
    font-weight="600"
    fill="#FFFFFF"
    fill-opacity="0.85"
    text-anchor="middle"
    letter-spacing="2">APRIL 7, 2026</text>

  <!-- Website bottom right -->
  <text x="1030" y="330"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="600"
    fill="#FFFFFF"
    fill-opacity="0.45"
    text-anchor="middle"
    letter-spacing="2">together-kc.com</text>

  <!-- Corner accent top left -->
  <circle cx="40" cy="40" r="5" fill="#C8102E"/>
  <text x="58" y="44"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="10"
    font-weight="700"
    fill="#FFFFFF"
    fill-opacity="0.4"
    letter-spacing="3">TOGETHER KC</text>
</svg>
