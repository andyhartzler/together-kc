<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- NEON text glow - Coral -->
    <filter id="neonCoralGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur1"/>
      <feFlood flood-color="#ff4040" flood-opacity="1"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="40" result="blur2"/>
      <feFlood flood-color="#ff4040" flood-opacity="0.6"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- NEON text glow - Blue -->
    <filter id="neonBlueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" result="blur1"/>
      <feFlood flood-color="#00aaff" flood-opacity="1"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="40" result="blur2"/>
      <feFlood flood-color="#00aaff" flood-opacity="0.6"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- NEON text glow - Golden -->
    <filter id="neonGoldenGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur1"/>
      <feFlood flood-color="#ffcc00" flood-opacity="1"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="35" result="blur2"/>
      <feFlood flood-color="#ffcc00" flood-opacity="0.5"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong text shadow -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Coral glow gradient -->
    <radialGradient id="coralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4040;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#ff4040;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ff4040;stop-opacity:0" />
    </radialGradient>

    <!-- Blue glow gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#00aaff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#00aaff;stop-opacity:0" />
    </radialGradient>

    <!-- Golden glow gradient -->
    <radialGradient id="goldenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#ffcc00;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:0" />
    </radialGradient>
  </defs>
      
  <defs>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1f35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#darkGradient)"/>
  <ellipse cx="-280" cy="850" rx="650" ry="500" fill="url(#goldenGlow)"/>
  <ellipse cx="820" cy="450" rx="600" ry="500" fill="url(#blueGlow)"/>

      <!-- Calendar -->
      <g transform="translate(370, 80)">
        <rect x="0" y="0" width="340" height="300" rx="36" fill="#ffffff" filter="url(#textShadow)"/>
        <rect x="0" y="0" width="340" height="90" rx="36" fill="#ff4040"/>
        <rect x="0" y="55" width="340" height="35" fill="#ff4040"/>
        <text x="170" y="68" font-family="Geist, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle">APRIL</text>
        <text x="170" y="235" font-family="Geist, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="160" font-weight="900" fill="#1e3a5f" text-anchor="middle">7</text>
      </g>

      <!-- "VOTE" -->
      <text x="540" y="729"
        font-family="Geist, -apple-system, BlinkMacSystemFont, Arial, sans-serif"
        font-size="200"
        font-weight="900"
        fill="#ff4040"
        text-anchor="middle"
        letter-spacing="-0.02em"
        filter="url(#neonCoralGlow)">VOTE</text>

      <!-- "YES" -->
      <text x="540" y="999"
        font-family="Geist, -apple-system, BlinkMacSystemFont, Arial, sans-serif"
        font-size="300"
        font-weight="900"
        fill="#ff4040"
        text-anchor="middle"
        letter-spacing="-0.03em"
        filter="url(#neonCoralGlow)">YES</text>

      <!-- Subtext -->
      <text x="540" y="1215"
        font-family="Geist, -apple-system, BlinkMacSystemFont, Arial, sans-serif"
        font-size="48"
        font-weight="700"
        fill="#ffffff"
        text-anchor="middle"
        filter="url(#textShadow)">Renew the E-Tax</text>

    </svg>