<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle shadow for text depth -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle glow for emphasis -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#0077C8" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Navy gradient for hero slides -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002855"/>
      <stop offset="60%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </linearGradient>

    <!-- Subtle blue radial for depth -->
    <radialGradient id="blueGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0077C8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0077C8" stop-opacity="0"/>
    </radialGradient>

    <!-- Light gradient for light slides -->
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Blue background with depth -->
    <radialGradient id="blueDepth" cx="20%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Red background with depth -->
    <radialGradient id="redGlow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow2" cx="10%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
      <!-- Navy gradient background -->
      <rect width="1080" height="1350" fill="url(#navyGradient)"/>
      <rect width="1080" height="1350" fill="url(#blueGlow)"/>

      <!-- Bottom accent line -->
      <defs>
        <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#C8102E"/>
          <stop offset="100%" stop-color="#0077C8"/>
        </linearGradient>
      </defs>
      <rect x="0" y="1344" width="1080" height="6" fill="url(#accentLine)"/>

      <!-- Content -->
      <g text-anchor="middle">
        <!-- Tagline -->
        <text x="540" y="420"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="28"
          font-weight="500"
          letter-spacing="12"
          fill="#0077C8">KANSAS CITY E-TAX RENEWAL</text>

        <!-- Main title -->
        <text x="540" y="560"
          font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
          font-size="180"
          font-weight="400"
          letter-spacing="8"
          fill="#FFFFFF">TOGETHER</text>
        <text x="540" y="720"
          font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
          font-size="180"
          font-weight="400"
          letter-spacing="8"
          fill="#FFFFFF">KC</text>

        <!-- CTA Box -->
        <rect x="360" y="800" width="360" height="100" fill="#C8102E"/>
        <text x="540" y="870"
          font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
          font-size="72"
          font-weight="400"
          letter-spacing="10"
          fill="#FFFFFF">VOTE YES</text>

        <!-- Date -->
        <text x="540" y="1000"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="36"
          font-weight="500"
          letter-spacing="6"
          fill="#FFFFFF"
          opacity="0.7">APRIL 7, 2026</text>
      </g>
    </svg>