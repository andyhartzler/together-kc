<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle shadow for text depth -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle glow for emphasis -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#0077C8" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Navy gradient for hero slides -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002855"/>
      <stop offset="60%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </linearGradient>

    <!-- Subtle blue radial for depth -->
    <radialGradient id="blueGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0077C8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0077C8" stop-opacity="0"/>
    </radialGradient>

    <!-- Light gradient for light slides -->
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Blue background with depth -->
    <radialGradient id="blueDepth" cx="20%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Red background with depth -->
    <radialGradient id="redGlow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow2" cx="10%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
      <!-- White background -->
      <rect width="1080" height="1350" fill="#FFFFFF"/>

      <!-- Top blue accent bar -->
      <rect x="0" y="0" width="1080" height="12" fill="#0077C8"/>

      <!-- Content -->
      <g>
        <!-- Label -->
        <text x="100" y="280"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="24"
          font-weight="700"
          letter-spacing="8"
          fill="#0077C8">THE FACTS</text>

        <!-- Headline -->
        <text x="100" y="420"
          font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
          font-size="110"
          font-weight="400"
          fill="#002855">THIS IS A</text>
        <text x="100" y="540"
          font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
          font-size="110"
          font-weight="400"
          fill="#C8102E">RENEWAL,</text>
        <text x="100" y="660"
          font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
          font-size="110"
          font-weight="400"
          fill="#002855">NOT A NEW</text>
        <text x="100" y="780"
          font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
          font-size="110"
          font-weight="400"
          fill="#002855">TAX.</text>

        <!-- Body text -->
        <text x="100" y="920"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="40"
          font-weight="400"
          fill="#002855">No one's taxes will go up.</text>
        <text x="100" y="980"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="40"
          font-weight="400"
          fill="#002855">We're simply asking Kansas City</text>
        <text x="100" y="1040"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="40"
          font-weight="400"
          fill="#002855">to continue funding the services</text>
        <text x="100" y="1100"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="40"
          font-weight="400"
          fill="#002855">we already depend on.</text>

        <!-- Bottom accent bar -->
        <rect x="100" y="1180" width="100" height="8" fill="#C8102E"/>
      </g>
    </svg>