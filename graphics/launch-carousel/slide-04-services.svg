<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle shadow for text depth -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle glow for emphasis -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#0077C8" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Navy gradient for hero slides -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002855"/>
      <stop offset="60%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </linearGradient>

    <!-- Subtle blue radial for depth -->
    <radialGradient id="blueGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0077C8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0077C8" stop-opacity="0"/>
    </radialGradient>

    <!-- Light gradient for light slides -->
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Blue background with depth -->
    <radialGradient id="blueDepth" cx="20%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Red background with depth -->
    <radialGradient id="redGlow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow2" cx="10%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
      <!-- Navy background -->
      <rect width="1080" height="1350" fill="#002855"/>

      <!-- Header -->
      <text x="80" y="140"
        font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
        font-size="80"
        font-weight="400"
        letter-spacing="4"
        fill="#FFFFFF">WHAT THE E-TAX FUNDS</text>

      <!-- Service cards - 2x2 grid -->
      <g>
        <!-- Row 1 -->
        <g transform="translate(80, 220)">
          <rect width="440" height="280" rx="0" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <text x="40" y="80" font-size="64">🚔</text>
          <text x="40" y="160" font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif" font-size="52" fill="#FFFFFF" letter-spacing="2">POLICE</text>
          <text x="40" y="220" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">Keeping neighborhoods safe</text>
          <text x="40" y="255" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">across KC</text>
        </g>
        <g transform="translate(560, 220)">
          <rect width="440" height="280" rx="0" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <text x="40" y="80" font-size="64">🚒</text>
          <text x="40" y="160" font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif" font-size="52" fill="#FFFFFF" letter-spacing="2">FIRE & EMS</text>
          <text x="40" y="220" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">Emergency response when</text>
          <text x="40" y="255" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">seconds count</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(80, 530)">
          <rect width="440" height="280" rx="0" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <text x="40" y="80" font-size="64">🛣️</text>
          <text x="40" y="160" font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif" font-size="52" fill="#FFFFFF" letter-spacing="2">STREET REPAIRS</text>
          <text x="40" y="220" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">Legally mandated</text>
          <text x="40" y="255" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">infrastructure funding</text>
        </g>
        <g transform="translate(560, 530)">
          <rect width="440" height="280" rx="0" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <text x="40" y="80" font-size="64">🗑️</text>
          <text x="40" y="160" font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif" font-size="52" fill="#FFFFFF" letter-spacing="2">TRASH PICKUP</text>
          <text x="40" y="220" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">Weekly service for</text>
          <text x="40" y="255" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">every household</text>
        </g>

        <!-- Row 3 - single wide card -->
        <g transform="translate(80, 840)">
          <rect width="920" height="180" rx="0" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <text x="40" y="70" font-size="64">❄️</text>
          <text x="130" y="80" font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif" font-size="52" fill="#FFFFFF" letter-spacing="2">SNOW REMOVAL</text>
          <text x="130" y="140" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.7">Keeping roads clear through harsh Missouri winters</text>
        </g>
      </g>
    </svg>