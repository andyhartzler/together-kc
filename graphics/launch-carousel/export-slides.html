<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Export Slides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --kc-blue: #0077C8;
      --kc-red: #C8102E;
      --navy: #002855;
      --white: #FFFFFF;
      --cream: #F8F6F1;
      --scale: 2.667;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #000;
      margin: 0;
      padding: 0;
    }

    .slide {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
    }

    /* SLIDE 1 */
    .slide-1 {
      background: linear-gradient(165deg, var(--navy) 0%, #001a3a 60%, #000d1a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 133px 107px;
    }

    .slide-1::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 80%;
      height: 120%;
      background: radial-gradient(ellipse, rgba(0, 119, 200, 0.12) 0%, transparent 70%);
    }

    .slide-1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 13px;
      background: linear-gradient(90deg, var(--kc-red), var(--kc-blue));
    }

    .slide-1 .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 219px;
      line-height: 0.95;
      color: var(--white);
      letter-spacing: 8px;
      margin-bottom: 80px;
    }

    .slide-1 .cta-box {
      background: var(--kc-red);
      padding: 53px 133px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
    }

    .slide-1 .cta-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 128px;
      color: var(--white);
      letter-spacing: 16px;
    }

    .slide-1 .cta-date {
      font-family: 'DM Sans', sans-serif;
      font-size: 43px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 8px;
      opacity: 0.85;
    }

    /* SLIDE 2 */
    .slide-2 {
      background: var(--white);
    }

    .slide-2::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 21px;
      background: var(--kc-blue);
    }

    .slide-2 .content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 160px 133px;
    }

    .slide-2 .label {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 11px;
      color: var(--kc-blue);
      text-transform: uppercase;
      margin-bottom: 80px;
    }

    .slide-2 .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 171px;
      line-height: 1;
      color: var(--navy);
      margin-bottom: 85px;
    }

    .slide-2 .headline em {
      font-style: normal;
      color: var(--kc-red);
    }

    .slide-2 .body-text {
      font-size: 53px;
      line-height: 1.6;
      color: var(--navy);
      font-weight: 400;
      max-width: 907px;
    }

    .slide-2 .accent-bar {
      position: absolute;
      bottom: 133px;
      left: 133px;
      width: 160px;
      height: 16px;
      background: var(--kc-red);
    }

    /* SLIDE 3 */
    .slide-3 {
      background: var(--kc-blue);
    }

    .slide-3 .bg-47 {
      position: absolute;
      top: -80px;
      right: -53px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1013px;
      color: rgba(255,255,255,0.06);
      line-height: 0.8;
    }

    .slide-3 .diagonal-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 80px,
        rgba(255,255,255,0.02) 80px,
        rgba(255,255,255,0.02) 83px
      );
    }

    .slide-3 .content {
      position: relative;
      z-index: 10;
      height: 100%;
      padding: 96px;
      display: flex;
      flex-direction: column;
    }

    .slide-3 .header {
      border-bottom: 3px solid rgba(255,255,255,0.15);
      padding-bottom: 43px;
    }

    .slide-3 .header span {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 11px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    .slide-3 .stat-block {
      margin-top: 75px;
    }

    .slide-3 .stat-block .number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 373px;
      color: var(--white);
      line-height: 0.85;
      letter-spacing: -11px;
    }

    .slide-3 .stat-block .number span {
      font-size: 160px;
      vertical-align: super;
      margin-left: 5px;
    }

    .slide-3 .stat-block .label {
      font-family: 'DM Sans', sans-serif;
      font-size: 48px;
      font-style: italic;
      color: rgba(255,255,255,0.9);
      margin-top: 11px;
    }

    .slide-3 .services {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 27px;
    }

    .slide-3 .service {
      background: rgba(0,40,85,0.5);
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 37px;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .slide-3 .service .icon {
      width: 96px;
      height: 96px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 43px;
    }

    .slide-3 .service .name {
      font-size: 35px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 1px;
    }

    /* SLIDE 4 */
    .slide-4 {
      background: #00152A;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 107px;
    }

    .slide-4 .rings {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
    }

    .slide-4 .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 3px solid;
    }

    .slide-4 .ring-1 {
      width: 587px;
      height: 587px;
      border-color: rgba(200,16,46,0.3);
    }

    .slide-4 .ring-2 {
      width: 853px;
      height: 853px;
      border-color: rgba(200,16,46,0.15);
    }

    .slide-4 .ring-3 {
      width: 1120px;
      height: 1120px;
      border-color: rgba(200,16,46,0.07);
    }

    .slide-4 .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(200,16,46,0.35) 0%, transparent 70%);
      filter: blur(133px);
    }

    .slide-4 .content {
      position: relative;
      z-index: 10;
    }

    .slide-4 .eyebrow {
      font-size: 29px;
      font-weight: 700;
      letter-spacing: 13px;
      text-transform: uppercase;
      color: var(--kc-red);
      margin-bottom: 53px;
    }

    .slide-4 .dollar-sign {
      font-family: 'DM Sans', sans-serif;
      font-size: 149px;
      font-weight: 300;
      font-style: italic;
      color: var(--kc-red);
      line-height: 1;
      margin-bottom: -27px;
    }

    .slide-4 .amount {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 373px;
      color: var(--white);
      line-height: 0.8;
      letter-spacing: 5px;
      text-shadow: 0 0 213px rgba(200,16,46,0.4);
    }

    .slide-4 .million {
      font-family: 'DM Sans', sans-serif;
      font-size: 85px;
      font-weight: 300;
      font-style: italic;
      color: rgba(255,255,255,0.75);
      margin-top: 11px;
    }

    .slide-4 .annual {
      font-size: 29px;
      font-weight: 600;
      letter-spacing: 13px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-top: 75px;
    }

    .slide-4 .quote {
      font-family: 'DM Sans', sans-serif;
      font-size: 43px;
      font-weight: 400;
      font-style: italic;
      color: rgba(255,255,255,0.55);
      margin-top: 96px;
      max-width: 800px;
      line-height: 1.55;
    }

    /* SLIDE 5 */
    .slide-5 {
      background: linear-gradient(180deg, #f7f5f2 0%, #ffffff 100%);
    }

    .slide-5 .vertical-line {
      position: absolute;
      left: 117px;
      top: 240px;
      bottom: 240px;
      width: 11px;
      background: linear-gradient(180deg, var(--kc-blue) 0%, var(--kc-red) 100%);
    }

    .slide-5 .year-watermark {
      position: absolute;
      bottom: 107px;
      right: -67px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 853px;
      color: rgba(0,31,63,0.035);
      line-height: 0.7;
    }

    .slide-5 .content {
      position: relative;
      z-index: 10;
      height: 100%;
      padding: 133px 107px 133px 187px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-5 .eyebrow {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 11px;
      text-transform: uppercase;
      color: var(--kc-blue);
      margin-bottom: 32px;
    }

    .slide-5 .since {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 11px;
      text-transform: uppercase;
      color: var(--navy);
      opacity: 0.45;
    }

    .slide-5 .year-big {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 347px;
      color: var(--navy);
      line-height: 0.85;
      letter-spacing: -11px;
      margin-top: -16px;
    }

    .slide-5 .stats-row {
      display: flex;
      gap: 107px;
      margin-top: 96px;
      padding-top: 75px;
      border-top: 3px solid rgba(0,31,63,0.1);
    }

    .slide-5 .mini-stat .value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 112px;
      color: var(--navy);
      line-height: 1;
    }

    .slide-5 .mini-stat .value.red {
      color: var(--kc-red);
    }

    .slide-5 .mini-stat .label {
      font-size: 29px;
      color: var(--navy);
      opacity: 0.55;
      margin-top: 11px;
      line-height: 1.3;
    }

    /* SLIDE 6 */
    .slide-6 {
      background: var(--kc-red);
    }

    .slide-6 .starburst {
      position: absolute;
      inset: 0;
      background: repeating-conic-gradient(
        from 0deg at 50% 130%,
        transparent 0deg,
        transparent 6deg,
        rgba(255,255,255,0.04) 6deg,
        rgba(255,255,255,0.04) 12deg
      );
    }

    .slide-6 .gradient-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 40% 30%, rgba(255,255,255,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(0,0,0,0.2) 0%, transparent 50%);
    }

    .slide-6 .content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .slide-6 .main-cta {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 107px;
    }

    .slide-6 .vote-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 171px;
      font-weight: 300;
      font-style: italic;
      color: var(--white);
      line-height: 0.95;
    }

    .slide-6 .yes-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 427px;
      color: var(--white);
      line-height: 0.75;
      letter-spacing: 27px;
      text-shadow: 0 27px 160px rgba(0,0,0,0.2);
    }

    .slide-6 .date-pill {
      background: var(--white);
      color: var(--kc-red);
      padding: 32px 85px;
      margin-top: 64px;
      text-align: center;
    }

    .slide-6 .date-pill .by {
      font-size: 27px;
      font-weight: 600;
      letter-spacing: 8px;
      display: block;
      margin-bottom: 5px;
    }

    .slide-6 .date-pill .date {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 59px;
      letter-spacing: 8px;
    }

    .slide-6 .bottom-bar {
      background: var(--navy);
      padding: 43px 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slide-6 .bottom-bar .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 43px;
      letter-spacing: 11px;
      color: var(--white);
    }

    .slide-6 .bottom-bar .url {
      font-size: 29px;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body id="slide-container">
</body>
<script>
const slides = [
  `<div class="slide slide-1">
    <div class="title">RENEW<br>THE KC<br>E-TAX</div>
    <div class="cta-box">
      <span class="cta-main">VOTE YES</span>
      <span class="cta-date">APRIL 7</span>
    </div>
  </div>`,
  `<div class="slide slide-2">
    <div class="content">
      <div class="label">The Facts</div>
      <h2 class="headline">This is a <em>renewal</em>, not a new tax.</h2>
      <p class="body-text">No one's taxes will go up. We're simply asking Kansas City to continue funding the services we already depend on.</p>
      <div class="accent-bar"></div>
    </div>
  </div>`,
  `<div class="slide slide-3">
    <div class="bg-47">47</div>
    <div class="diagonal-lines"></div>
    <div class="content">
      <div class="header">
        <span>What Your E-Tax Funds</span>
      </div>
      <div class="stat-block">
        <div class="number">47<span>%</span></div>
        <div class="label">of the city's general fund</div>
      </div>
      <div class="services">
        <div class="service">
          <div class="icon">🚔</div>
          <div class="name">Police</div>
        </div>
        <div class="service">
          <div class="icon">🚒</div>
          <div class="name">Fire & EMS</div>
        </div>
        <div class="service">
          <div class="icon">🛣️</div>
          <div class="name">Street Repairs</div>
        </div>
        <div class="service">
          <div class="icon">🗑️</div>
          <div class="name">Trash Pickup</div>
        </div>
      </div>
    </div>
  </div>`,
  `<div class="slide slide-4">
    <div class="rings">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
    </div>
    <div class="glow"></div>
    <div class="content">
      <div class="eyebrow">Annual Revenue</div>
      <div class="money-display">
        <div class="dollar-sign">$</div>
        <div class="amount">373.7</div>
        <div class="million">million</div>
      </div>
      <div class="annual">FY 25/26</div>
      <p class="quote">"There is no realistic replacement for this funding source."</p>
    </div>
  </div>`,
  `<div class="slide slide-5">
    <div class="vertical-line"></div>
    <div class="year-watermark">63</div>
    <div class="content">
      <div class="eyebrow">A Proven Track Record</div>
      <div class="since">SINCE</div>
      <div class="year-big">1963</div>
      <div class="stats-row">
        <div class="mini-stat">
          <div class="value red">1%</div>
          <div class="label">Tax rate</div>
        </div>
        <div class="mini-stat">
          <div class="value">~50%</div>
          <div class="label">Paid by non-residents</div>
        </div>
      </div>
    </div>
  </div>`,
  `<div class="slide slide-6">
    <div class="starburst"></div>
    <div class="gradient-overlay"></div>
    <div class="content">
      <div class="main-cta">
        <div class="vote-text">Vote</div>
        <div class="yes-text">YES</div>
        <div class="date-pill">
          <span class="by">BY</span>
          <span class="date">APRIL 7</span>
        </div>
      </div>
      <div class="bottom-bar">
        <div class="logo">TOGETHER KC</div>
        <div class="url">together-kc.com</div>
      </div>
    </div>
  </div>`
];

const urlParams = new URLSearchParams(window.location.search);
const slideNum = parseInt(urlParams.get('slide')) || 1;
document.getElementById('slide-container').innerHTML = slides[slideNum - 1];
</script>
</html>
