<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle shadow for text depth -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle glow for emphasis -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#0077C8" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Navy gradient for hero slides -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002855"/>
      <stop offset="60%" stop-color="#001a3a"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </linearGradient>

    <!-- Subtle blue radial for depth -->
    <radialGradient id="blueGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0077C8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0077C8" stop-opacity="0"/>
    </radialGradient>

    <!-- Light gradient for light slides -->
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Blue background with depth -->
    <radialGradient id="blueDepth" cx="20%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Red background with depth -->
    <radialGradient id="redGlow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow2" cx="10%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
      <!-- Light gradient background -->
      <rect width="1080" height="1350" fill="url(#lightGradient)"/>

      <!-- Left accent bar -->
      <defs>
        <linearGradient id="leftBar" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0077C8"/>
          <stop offset="100%" stop-color="#C8102E"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="10" height="1350" fill="url(#leftBar)"/>

      <!-- Content -->
      <g>
        <!-- Since label -->
        <text x="100" y="320"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="28"
          font-weight="500"
          letter-spacing="8"
          fill="#0077C8">SINCE</text>

        <!-- Big year -->
        <text x="100" y="520"
          font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
          font-size="220"
          font-weight="400"
          letter-spacing="-4"
          fill="#002855">1963</text>

        <!-- Timeline -->
        <g transform="translate(100, 600)">
          <circle cx="0" cy="0" r="10" fill="#0077C8"/>
          <rect x="20" y="-2" width="600" height="4" fill="#0077C8" opacity="0.3"/>
          <text x="660" y="12" font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif" font-size="52" fill="#002855">2026</text>
        </g>

        <!-- History text -->
        <text x="100" y="720"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="36"
          font-weight="400"
          fill="#002855">For over 60 years, Kansas City</text>
        <text x="100" y="775"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="36"
          font-weight="400"
          fill="#002855">voters have renewed the E-Tax</text>
        <text x="100" y="830"
          font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="36"
          font-weight="400"
          fill="#002855">to keep our city running strong.</text>

        <!-- Approval stat box -->
        <g transform="translate(100, 920)">
          <rect width="400" height="140" fill="#002855"/>
          <text x="30" y="95"
            font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
            font-size="90"
            font-weight="400"
            fill="#0077C8">77%</text>
          <text x="200" y="60"
            font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
            font-size="26"
            font-weight="400"
            fill="#FFFFFF">Approved</text>
          <text x="200" y="100"
            font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
            font-size="26"
            font-weight="400"
            fill="#FFFFFF">in 2021</text>
        </g>
      </g>
    </svg>