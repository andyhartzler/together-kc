<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Facebook Endorsements Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: none;
    }

    .banner {
      width: 820px;
      height: 312px;
      background: #002855;
      position: relative;
      display: flex;
      overflow: visible;
    }

    .left-accent {
      position: absolute;
      left: 0;
      top: 0;
      width: 5px;
      height: 100%;
      background: #C8102E;
    }

    .bottom-accent {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: #C8102E;
    }

    .left-side {
      width: 200px;
      padding: 25px 15px 15px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .vote-yes-box {
      background: #C8102E;
      border-radius: 6px;
      padding: 20px 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .vote-yes-text {
      font-family: 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
      font-size: 52px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 4px;
      line-height: 1;
    }

    .by-april {
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .renew-text-single {
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
    }

    .date {
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #C8102E;
    }

    .paid-for {
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 8px;
      color: rgba(255,255,255,0.6);
      margin-top: auto;
    }

    .right-side {
      flex: 1;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
    }

    .endorsed-header {
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #C8102E;
      text-align: center;
      margin-bottom: 12px;
    }

    .logo-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 10px;
    }

    .logo-row.featured {
      margin-bottom: 15px;
    }

    .logo-row.featured img {
      height: 55px;
      width: auto;
      max-width: 130px;
      object-fit: contain;
    }

    .logo-row.featured img.bigger {
      height: 65px;
      max-width: 145px;
    }

    .logo-row.small img {
      height: 40px;
      width: auto;
      max-width: 100px;
      object-fit: contain;
    }

    .logo-row.small img.bigger {
      height: 52px;
      max-width: 120px;
    }

    .more-text {
      font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      text-align: right;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="left-accent"></div>
    <div class="bottom-accent"></div>

    <div class="left-side">
      <div class="vote-yes-box">
        <div class="vote-yes-text">VOTE<br>YES</div>
        <div class="by-april">By APRIL 7</div>
      </div>

      <div class="renew-text-single">Renew the Earnings Tax</div>
    </div>

    <div class="right-side">
      <div class="endorsed-header">Endorsed by:</div>

      <!-- Row 1: 4 Featured (bigger) -->
      <div class="logo-row featured">
        <img src="../public/images/endorsers/Heavy Constructors.png" alt="Heavy Constructors">
        <img src="../public/images/endorsers/KC Chamber.PNG" alt="KC Chamber">
        <img src="../public/images/endorsers/Civic Council of Greater Kansas City.png" alt="Civic Council">
        <img src="../public/images/endorsers/Greater Kansas City AFL-CIO.png" alt="AFL-CIO">
      </div>

      <!-- Row 2: 5 logos -->
      <div class="logo-row small">
        <img src="../public/images/endorsers/FOP.png" alt="FOP">
        <img src="../public/images/endorsers/Local 42.png" alt="Local 42">
        <img src="../public/images/endorsers/Urban League.png" alt="Urban League" style="transform: scale(1.4);">
        <img src="../public/images/endorsers/Freedom Inc.PNG" alt="Freedom Inc">
        <img src="../public/images/endorsers/Downtown Council.png" alt="Downtown Council">
      </div>

      <!-- Row 3: 5 logos -->
      <div class="logo-row small">
        <img src="../public/images/endorsers/Plumbers Local 8.png" alt="Plumbers 8">
        <img src="../public/images/endorsers/IBEW Local 124.png" alt="IBEW 124">
        <img src="../public/images/endorsers/IUOE Local 101 logo.png" alt="IUOE 101">
        <img src="../public/images/endorsers/Pipefitters Local 533.png" alt="Pipefitters">
        <img src="../public/images/endorsers/Greater KC Building Construction Trades Council .png" alt="Building Trades">
      </div>

      <!-- Row 4: 5 logos -->
      <div class="logo-row small">
        <img src="../public/images/endorsers/Heartland Black Chamber.PNG" alt="Heartland Black Chamber">
        <img src="../public/images/endorsers/Northeast Chamber of Commerce.png" alt="Northeast Chamber">
        <img src="../public/images/endorsers/12th Street Heritage.png" alt="12th Street Heritage" class="bigger">
        <img src="../public/images/endorsers/Health Forward Foundation.png" alt="Health Forward" style="transform: scale(1.4);">
        <img src="../public/images/endorsers/Laborers 264.PNG" alt="LiUNA 264">
      </div>

      <div class="more-text">See the full list at together-kc.com/endorsements</div>
    </div>
  </div>
</body>
</html>
